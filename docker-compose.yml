# Local infrastructure: PostGIS + Redis.
# The API itself runs on the host (`pnpm dev:api`) for fast reloads.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: simpleride
      POSTGRES_USER: simpleride_owner
      POSTGRES_PASSWORD: owner_dev_password
      # Read by infra/postgres/init.sh to create the RLS-bound app role
      APP_DB_PASSWORD: app_dev_password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpleride_owner -d simpleride"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
